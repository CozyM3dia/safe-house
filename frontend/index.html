<!doctype html>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/safe-icon.png" />
    <meta name="theme-color" content="#12100d" />
    <script>
      // theme-color mengikuti toggle tema in-app (bukan hanya OS preference).
      (() => {
        const set = () => {
          let m = document.querySelector('meta[name="theme-color"]');
          if (!m) {
            m = document.createElement('meta');
            m.name = 'theme-color';
            document.head.appendChild(m);
          }
          m.content =
            document.documentElement.dataset.theme === 'light' ? '#f4efe6' : '#12100d';
        };
        set();
        new MutationObserver(set).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['data-theme'],
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      try {
        const persisted = JSON.parse(localStorage.getItem('safe-house-store') || 'null');
        const theme = persisted?.state?.theme;
        const lang = persisted?.state?.lang;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        if (lang === 'en' || lang === 'id') document.documentElement.lang = lang;
      } catch (_) {
        // React will apply the safe defaults after hydration.
      }
    </script>
