<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/safe-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      try {
        const persisted = JSON.parse(localStorage.getItem('safe-house-store') || 'null');
        const theme = persisted?.state?.theme;
        const lang = persisted?.state?.lang;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        if (lang === 'en' || lang === 'id') document.documentElement.lang = lang;
      } catch (_) {
        // React will apply the safe defaults after hydration.
      }
    </script>

    <!-- Primary meta — B2B: konsultan perizinan / PBG -->
    <title>S.A.F.E House — Audit Risiko Geoteknik Properti</title>
    <meta
      name="description"
      content="S.A.F.E House (Seismic Analysis for Foundation Evaluation) — Platform audit geospasial & geoteknik berbasis AI untuk parameter SNI 1726:2019, PGA desain, FS likuefaksi, dan bahaya banjir dari satu koordinat."
    />
    <meta name="keywords" content="kelas situs SNI 1726 2019, cara menghitung Vs30, PGA desain gempa Indonesia, penyelidikan tanah PBG, likuefaksi factor of safety, syarat PBG 2026, desk study geoteknik" />
    <link rel="canonical" href="__PUBLIC_SITE_URL__/" />

    <!-- Open Graph — origin diisi saat build (VITE_PUBLIC_SITE_URL).
         Default: host Emergent LIVE. Jangan hardcode safehouse.web.id (NXDOMAIN).
         Per-laporan: crawler harus memukul /api/og/laporan/{slug}. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="S.A.F.E House" />
    <meta property="og:title" content="S.A.F.E House — AI Geotechnical & Disaster Risk Platform" />
    <meta property="og:description" content="Kelas situs SNI 1726:2019, PGA desain, FS likuefaksi, dan bahaya banjir dari satu koordinat. Untuk konsultan perizinan, developer, dan konsultan geoteknik." />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:url" content="__PUBLIC_SITE_URL__/" />
    <meta property="og:image" content="__PUBLIC_SITE_URL__/api/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="S.A.F.E House — parameter SNI 1726:2019 siap-PBG dari satu koordinat" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="S.A.F.E House — Parameter Gempa & Tanah untuk PBG" />
    <meta name="twitter:description" content="Desk study geoteknik SNI 1726:2019 dari satu koordinat, dalam dua menit." />
    <meta name="twitter:image" content="__PUBLIC_SITE_URL__/api/og/default.png" />

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "S.A.F.E House",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Desk study geoteknik untuk perizinan bangunan (PBG): kelas situs SNI 1726:2019, PGA desain, factor of safety likuefaksi, dan bahaya banjir dari satu titik koordinat.",
      "inLanguage": "id-ID",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
      "creator": { "@type": "Organization", "name": "S.A.F.E House" },
      "featureList": [
        "Kelas situs SNI 1726:2019",
        "PGA desain PuSGeN",
        "Factor of Safety likuefaksi (Seed & Idriss)",
        "Bahaya banjir InaRISK BNPB",
        "Deteksi kedekatan sesar aktif"
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Archivo:wght@400;700;800;900&family=Red+Hat+Display:wght@400;600;700&family=Azeret+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
